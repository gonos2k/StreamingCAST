[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "streamingcast"
version = "0.1.0"
description = "Local-first streaming contracts and differentiable forecast verification"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<3", "torch>=2.10,<2.11"]

[project.optional-dependencies]
test = ["pytest>=8,<10", "scipy>=1.14,<2"]

[project.scripts]
streamingcast = "streamingcast.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
